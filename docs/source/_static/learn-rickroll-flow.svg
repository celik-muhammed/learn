<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Rickroll interaction flow</title>
  <desc id="desc">An original five-step flow diagram: link, click, reveal, recognition, and sharing.</desc>
  <rect width="1200" height="675" rx="36" fill="#f7f7f4"/>
  <text x="70" y="90" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#252525">Interaction flow</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(55 220)"><rect width="190" height="180" rx="24" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="95" y="72" font-size="28" font-weight="700">1 · Link</text><text x="95" y="115" font-size="21" fill="#555">sets an expectation</text></g>
    <g transform="translate(280 220)"><rect width="190" height="180" rx="24" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="95" y="72" font-size="28" font-weight="700">2 · Click</text><text x="95" y="115" font-size="21" fill="#555">opens destination</text></g>
    <g transform="translate(505 220)"><rect width="190" height="180" rx="24" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="95" y="72" font-size="28" font-weight="700">3 · Reveal</text><text x="95" y="115" font-size="21" fill="#555">expectation flips</text></g>
    <g transform="translate(730 220)"><rect width="190" height="180" rx="24" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="95" y="72" font-size="28" font-weight="700">4 · Recognize</text><text x="95" y="115" font-size="21" fill="#555">meme is identified</text></g>
    <g transform="translate(955 220)"><rect width="190" height="180" rx="24" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="95" y="72" font-size="28" font-weight="700">5 · Share</text><text x="95" y="115" font-size="21" fill="#555">pattern propagates</text></g>
  </g>
  <g stroke="#5b5b50" stroke-width="6" fill="none" stroke-linecap="round"><path d="M245 310h28"/><path d="M470 310h28"/><path d="M695 310h28"/><path d="M920 310h28"/></g>
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" fill="#3d3d37">A compact model for discussing the prank without reproducing any video imagery.</text>
</svg>
