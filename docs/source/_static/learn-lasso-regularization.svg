<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Lasso regularization: fit, penalty, and sparsity</title>
  <desc id="desc">Three connected panels show data fit, an L1 penalty, and a sparse coefficient vector with several coefficients reduced to zero.</desc>
  <rect width="1200" height="620" rx="28" fill="#f8f9fb"/>
  <g font-family="system-ui, sans-serif" fill="#20242b">
    <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700">Lasso: fit + L1 penalty → sparse coefficients</text>
    <rect x="70" y="130" width="300" height="330" rx="24" fill="#ffffff" stroke="#a8b1bd" stroke-width="3"/>
    <text x="220" y="180" text-anchor="middle" font-size="26" font-weight="650">1. Fit the data</text>
    <line x1="120" y1="390" x2="320" y2="220" stroke="#4f667a" stroke-width="4"/>
    <g fill="#596f82">
      <circle cx="125" cy="365" r="9"/><circle cx="165" cy="340" r="9"/><circle cx="205" cy="305" r="9"/>
      <circle cx="245" cy="295" r="9"/><circle cx="280" cy="255" r="9"/><circle cx="322" cy="238" r="9"/>
    </g>
    <text x="220" y="430" text-anchor="middle" font-size="19">reduce prediction error</text>

    <rect x="450" y="130" width="300" height="330" rx="24" fill="#ffffff" stroke="#a8b1bd" stroke-width="3"/>
    <text x="600" y="180" text-anchor="middle" font-size="26" font-weight="650">2. Add L1 penalty</text>
    <text x="600" y="270" text-anchor="middle" font-size="42" font-family="serif">α · Σ |wⱼ|</text>
    <text x="600" y="330" text-anchor="middle" font-size="19">larger α → stronger shrinkage</text>
    <text x="600" y="372" text-anchor="middle" font-size="19">penalty depends on absolute coefficients</text>

    <rect x="830" y="130" width="300" height="330" rx="24" fill="#ffffff" stroke="#a8b1bd" stroke-width="3"/>
    <text x="980" y="180" text-anchor="middle" font-size="26" font-weight="650">3. Inspect sparsity</text>
    <g font-size="21">
      <text x="880" y="245">w₁</text><rect x="930" y="224" width="140" height="22" rx="11" fill="#667c8e"/>
      <text x="880" y="292">w₂</text><rect x="930" y="271" width="2" height="22" rx="1" fill="#667c8e"/><text x="948" y="290" fill="#68717c">0</text>
      <text x="880" y="339">w₃</text><rect x="930" y="318" width="95" height="22" rx="11" fill="#667c8e"/>
      <text x="880" y="386">w₄</text><rect x="930" y="365" width="2" height="22" rx="1" fill="#667c8e"/><text x="948" y="384" fill="#68717c">0</text>
    </g>
    <text x="980" y="430" text-anchor="middle" font-size="19">some coefficients become exactly zero</text>

    <path d="M382 294 H438" stroke="#68717c" stroke-width="5"/><path d="M428 282 L442 294 L428 306" fill="none" stroke="#68717c" stroke-width="5"/>
    <path d="M762 294 H818" stroke="#68717c" stroke-width="5"/><path d="M808 282 L822 294 L808 306" fill="none" stroke="#68717c" stroke-width="5"/>
    <text x="600" y="535" text-anchor="middle" font-size="21">Tune the trade-off with validation; zero coefficients are model behavior, not automatic proof of causal irrelevance.</text>
  </g>
</svg>
