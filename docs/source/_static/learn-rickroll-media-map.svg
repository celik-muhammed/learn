<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Learn media relationship map</title>
  <desc id="desc">An original diagram connecting one Rickroll topic to five video variants and one multi-image whiteboard.</desc>
  <rect width="1200" height="675" rx="36" fill="#f7f7f4"/>
  <text x="70" y="80" font-family="system-ui,sans-serif" font-size="40" font-weight="700" fill="#252525">One topic, multiple media records</text>
  <rect x="420" y="260" width="360" height="150" rx="30" fill="#fff" stroke="#4f4f48" stroke-width="4"/>
  <text x="600" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" font-weight="750" fill="#252525">Rickroll Topic</text>
  <text x="600" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#555">shared context + related records</text>
  <g font-family="system-ui,sans-serif" font-size="21" text-anchor="middle">
    <g><rect x="55" y="135" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="170" y="188">Video · 4K</text></g>
    <g><rect x="55" y="292" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="170" y="345">Video · HD</text></g>
    <g><rect x="55" y="449" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="170" y="502">Video · Animated</text></g>
    <g><rect x="915" y="135" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="1030" y="188">Video · Audio</text></g>
    <g><rect x="915" y="292" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="1030" y="345">Video · Showcase</text></g>
    <g><rect x="915" y="449" width="230" height="88" rx="22" fill="#fff" stroke="#8b8b7a" stroke-width="3"/><text x="1030" y="490">Whiteboard</text><text x="1030" y="518" font-size="18" fill="#555">3 images</text></g>
  </g>
  <g stroke="#68685f" stroke-width="4" fill="none"><path d="M420 300L285 180"/><path d="M420 335L285 336"/><path d="M420 370L285 493"/><path d="M780 300L915 180"/><path d="M780 335L915 336"/><path d="M780 370L915 493"/></g>
</svg>
