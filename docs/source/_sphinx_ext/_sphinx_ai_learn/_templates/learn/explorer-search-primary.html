<div class="learn-search-primary-row">
  <div class="learn-trending-search">
    <label class="sr-only" for="{{ search_input_id|e }}">Search</label>
    <div class="learn-search-field">
      <input id="{{ search_input_id|e }}"
             class="learn-search-input"
             type="search"
             name="q"
             placeholder="{{ search_placeholder|e }}"
             autocomplete="off">
      <button type="submit"
              class="learn-search-submit"
              data-explorer-search
              aria-label="Search"
              title="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm5.5 10 5.2 5.2-1.4 1.4-5.2-5.2Z"></path>
        </svg>
      </button>
    </div>
  </div>
  <button type="button"
          class="learn-filter-disclosure"
          data-explorer-filter-toggle
          aria-label="More search options"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="{{ filter_panel_id|e }}"
          title="More options">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
</div>
