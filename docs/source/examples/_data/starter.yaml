# A tiny starter collection for `gallery-grid`.
#
# FOUR keys are rendered on the card:
#     title    -> the heading            (the only required key)
#     link     -> where the card goes
#     content  -> body text
#     img-top  -> a picture above the heading
#
# EVERYTHING ELSE is data: invisible on the card, but usable in
# :filter:, :sort: and :group-by:.  That is why `level: beginner`
# does not appear on the card, and why `:filter: level=beginner` works.

- title: Plotting a confusion matrix
  link: https://scikit-plots.github.io/
  content: Start here if you have never used scikit-plots.
  level: beginner
  minutes: 5
  topic: [classification, metrics]
  added: 2025-01-15

